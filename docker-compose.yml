  node-05:
    profiles: ["lab"]
    build:
      context: .
      dockerfile: agent/Dockerfile
    container_name: provenops-node-05
    hostname: node-05
    restart: unless-stopped
    environment:
      PROVENOPS_HOSTNAME: node-05
      PROVENOPS_CONTROL_PLANE_ADDR: control-plane:9090
      PROVENOPS_BOOTSTRAP_TOKEN: token-node-05
      PROVENOPS_ENVIRONMENT: lab
      PROVENOPS_TLS_ENABLED: "true"
      PROVENOPS_TLS_SERVER_NAME: control-plane
      PROVENOPS_TLS_CA_CERT: /etc/provenops/certs/ca.crt
      PROVENOPS_TLS_CLIENT_CERT: /etc/provenops/certs/client.crt
      PROVENOPS_TLS_CLIENT_KEY: /etc/provenops/certs/client.key
      OPSPILOT_HOSTNAME: node-05
      OPSPILOT_CONTROL_PLANE_ADDR: control-plane:9090
      OPSPILOT_BOOTSTRAP_TOKEN: token-node-05
    volumes:
      - node05_certs:/etc/provenops/certs
    networks:
      - agent-net
    depends_on:
      - control-plane

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  agent-net:
    driver: bridge

volumes:
  provenops_pgdata:
  controlplane_certs:
  node01_certs:
  node02_certs:
  node03_certs:
  node04_certs:
  node05_certs:
