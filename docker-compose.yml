      PROVENOPS_ENVIRONMENT: lab
      PROVENOPS_TLS_ENABLED: "true"
      PROVENOPS_TLS_SERVER_NAME: control-plane
      PROVENOPS_TLS_CA_CERT: /etc/provenops/certs/ca.crt
      PROVENOPS_TLS_CLIENT_CERT: /etc/provenops/certs/client.crt
      PROVENOPS_TLS_CLIENT_KEY: /etc/provenops/certs/client.key
      OPSPILOT_HOSTNAME: node-04
      OPSPILOT_CONTROL_PLANE_ADDR: control-plane:9090
      OPSPILOT_BOOTSTRAP_TOKEN: token-node-04
    volumes:
      - node04_certs:/etc/provenops/certs
    networks:
      - agent-net
    depends_on:
